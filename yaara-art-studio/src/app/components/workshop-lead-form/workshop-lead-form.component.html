<section class="workshop-form-section" [id]="instanceId">
  <div class="container">
    <p class="closing-line" *ngIf="closingLine">{{ closingLine }}</p>

    <div class="schedule" *ngIf="showSchedule">
      <p class="schedule-line">6 מפגשים | ימי חמישי | 10:00-13:00</p>
      <p class="schedule-note">כדי לשריין את מקומך בקורס שמתחיל מיד אחרי החגים</p>
    </div>

    <h2 class="section-title">
      <span class="title-emoji" aria-hidden="true">📩</span>
      {{ heading }}
    </h2>

    <div class="form-card" *ngIf="!showSuccessMessage">
      <form [formGroup]="leadForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label [attr.for]="firstNameId">שם פרטי *</label>
            <input
              type="text"
              [id]="firstNameId"
              formControlName="firstName"
              [class.error]="isFieldInvalid('firstName')"
              autocomplete="given-name" />
            <span class="error-message" *ngIf="isFieldInvalid('firstName')">שם פרטי הוא שדה חובה</span>
          </div>

          <div class="form-group">
            <label [attr.for]="lastNameId">שם משפחה *</label>
            <input
              type="text"
              [id]="lastNameId"
              formControlName="lastName"
              [class.error]="isFieldInvalid('lastName')"
              autocomplete="family-name" />
            <span class="error-message" *ngIf="isFieldInvalid('lastName')">שם משפחה הוא שדה חובה</span>
          </div>

          <div class="form-group">
            <label [attr.for]="phoneId">מספר טלפון *</label>
            <input
              type="tel"
              [id]="phoneId"
              formControlName="phone"
              [class.error]="isFieldInvalid('phone')"
              autocomplete="tel" />
            <span class="error-message" *ngIf="isFieldInvalid('phone')">מספר טלפון הוא שדה חובה</span>
          </div>

          <div class="form-group full">
            <label [attr.for]="messageId">הודעה (לא חובה)</label>
            <textarea [id]="messageId" formControlName="message" rows="3"></textarea>
          </div>
        </div>

        <p class="submit-error" *ngIf="submitError" role="alert">{{ submitError }}</p>

        <button type="submit" class="btn btn-primary submit-btn" [disabled]="isSubmitting">
          {{ isSubmitting ? 'שולחים...' : 'אני רוצה להרשם!' }}
          <span class="title-emoji" aria-hidden="true" *ngIf="!isSubmitting">✨</span>
        </button>
      </form>
    </div>

    <div class="success-card" *ngIf="showSuccessMessage" role="status">
      <h3>קיבלנו את הפרטים!</h3>
      <p>נחזור אליכם בהקדם לבדיקת התאמה לקורס.</p>
    </div>
  </div>
</section>
